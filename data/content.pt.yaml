  projects:
    - name: Home Lab Pessoal & Infraestrutura de Rede
      date: "2025 - Presente"
      link: https://github.com/znx0
      description: >-
        Um servidor doméstico self-hosted implementado em hardware dedicado Raspberry Pi, concebido para testes de segurança de rede, implementação de serviços, e monitorização em tempo real de infraestrutura física.
        A configuração integra um módulo de telemetria IoT personalizado, com um sensor de temperatura e ecrã LCD ligados ao servidor, com alertas visuais e sonoros automatizados (LEDs e buzzer) quando são atingidos limiares térmicos críticos.
    - name: Bloqueador de Anúncios e DNS Sinkhole para Toda a Rede
      date: "2026 - Presente"
      link: https://github.com/znx0
      description: >-
        Uma solução de bloqueio de anúncios e privacidade para toda a rede, implementada num Raspberry Pi com Pi-hole.
        O sistema funciona como um DNS sinkhole local para bloquear anúncios, domínios de rastreio e telemetria maliciosa em todos os dispositivos da rede.
        Configurou listas de bloqueio personalizadas, registos DNS locais, e analisou logs de consultas DNS para monitorizar e proteger o tráfego de rede de saída.
    - name: Competição de Robô Seguidor de Linha Autónomo
      date: "2021 - 2021"
      link: http://github.com/znx0
      description: >-
        Um robô móvel autónomo baseado em microcontrolador, desenvolvido para seguir trajetos complexos utilizando arrays de sensores de ultrassons e infravermelhos.
        Programado em C numa plataforma ESP32, incorporando algoritmos de controlo PID em malha fechada para um controlo suave dos motores e navegação precisa.
        Concebeu o layout do hardware, os circuitos de controlo dos motores, e otimizou a leitura dos sensores para resposta em tempo real.
    - name: Jogador Competitivo de CTF & Laboratórios de Segurança
      date: "2024 - Presente"
      link: https://themctf.com/
      description: >-
        Membro ativo de uma equipa competitiva, participando em eventos globais de Capture The Flag (CTF) no formato jeopardy, resolvendo desafios de elevada dificuldade em web exploitation, criptografia e engenharia inversa.
        Colabora com os restantes membros da equipa no desenvolvimento de exploits e writeups para competições internacionais em plataformas como CTFtime.
        Complementado com prática ativa no TryHackMe para aperfeiçoamento contínuo de competências.
